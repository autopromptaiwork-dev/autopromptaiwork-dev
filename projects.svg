<svg width="1000" height="520" viewBox="0 0 1000 520"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061522"/>
      <stop offset="55%" stop-color="#071827"/>
      <stop offset="100%" stop-color="#030A11"/>
    </linearGradient>

    <!-- Card gradients -->
    <linearGradient id="cardBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A2134"/>
      <stop offset="100%" stop-color="#06121E"/>
    </linearGradient>

    <linearGradient id="cardPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17102D"/>
      <stop offset="100%" stop-color="#080D18"/>
    </linearGradient>

    <!-- Cyan glow -->
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Purple glow -->
    <filter id="purpleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle shadow -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10"
                    flood-color="#000000" flood-opacity="0.45"/>
    </filter>

  </defs>

  <!-- BACKGROUND -->
  <rect width="1000" height="520" rx="28" fill="url(#bg)"/>

  <!-- Decorative glow -->
  <circle cx="130" cy="120" r="150"
          fill="#00CFFF" opacity="0.035"/>

  <circle cx="870" cy="350" r="180"
          fill="#8E5CFF" opacity="0.04"/>

  <!-- HEADER -->
  <text x="500" y="55"
        text-anchor="middle"
        fill="#F4F8FC"
        font-family="Arial, Helvetica, sans-serif"
        font-size="27"
        font-weight="700">
    🚀 Featured Projects
  </text>

  <text x="500" y="82"
        text-anchor="middle"
        fill="#7F94A8"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13">
    Real automation systems built with AI, workflows and APIs
  </text>

  <!-- HEADER LINE -->
  <line x1="100" y1="105" x2="900" y2="105"
        stroke="#173247"
        stroke-width="1"/>


  <!-- ====================================================== -->
  <!-- PROJECT 1 -->
  <!-- ====================================================== -->

  <rect x="55" y="130"
        width="430"
        height="335"
        rx="22"
        fill="url(#cardBlue)"
        stroke="#008CFF"
        stroke-width="1.3"
        filter="url(#shadow)"/>

  <!-- Cyan accent -->
  <rect x="55" y="130"
        width="430"
        height="4"
        rx="2"
        fill="#00D9FF"
        filter="url(#cyanGlow)"/>

  <!-- Project icon -->

<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="900"
     height="720"
     viewBox="0 0 900 720">

  <defs>

    <!-- =========================
         BACKGROUND
    ========================== -->

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03101e"/>
      <stop offset="50%" stop-color="#061a2b"/>
      <stop offset="100%" stop-color="#020817"/>
    </linearGradient>

    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00eaff" stop-opacity=".24"/>
      <stop offset="55%" stop-color="#00bfff" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#00bfff" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12"
                    flood-color="#00dfff"
                    flood-opacity=".25"/>
    </filter>

    <!-- =========================
         CARD GRADIENT
    ========================== -->

    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061c2e"/>
      <stop offset="50%" stop-color="#041522"/>
      <stop offset="100%" stop-color="#02101d"/>
    </linearGradient>

    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00eaff"/>
      <stop offset="50%" stop-color="#00bfff"/>
      <stop offset="100%" stop-color="#00eaff"/>
    </linearGradient>

    <linearGradient id="button" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#04273a"/>
      <stop offset="100%" stop-color="#063d55"/>
    </linearGradient>

    <!-- =========================
         HOVER STYLE
    ========================== -->

    <style>
      .interactive {
        cursor: pointer;
        transition: all .25s ease;
      }

      .interactive:hover {
        filter: url(#strongGlow);
      }

      .node {
        cursor: pointer;
      }

      .node:hover rect {
        fill: #082f45;
        stroke: #00efff;
        stroke-width: 3;
        filter: url(#strongGlow);
      }

      .node:hover text {
        fill: #ffffff;
      }

      .node:hover .nodeIcon {
        filter: url(#strongGlow);
      }

      .repoButton {
        cursor: pointer;
      }

      .repoButton:hover rect {
        fill: #06455d;
        stroke: #7df7ff;
        stroke-width: 3;
        filter: url(#strongGlow);
      }

      .repoButton:hover text {
        fill: #ffffff;
      }

      .tag:hover rect {
        fill: #082f45;
        stroke: #00efff;
        filter: url(#softGlow);
      }

      .tag:hover text {
        fill: #ffffff;
      }
    </style>

    <!-- =========================
         GOOGLE FORMS ICON
    ========================== -->

    <g id="googleForms">
      <rect x="0" y="0" width="34" height="42" rx="3"
            fill="#673AB7"/>
      <path d="M24 0 L34 10 L24 10 Z"
            fill="#B39DDB"/>
      <rect x="7" y="16" width="19" height="3" rx="1.5" fill="white"/>
      <rect x="7" y="23" width="15" height="3" rx="1.5" fill="white"/>
      <rect x="7" y="30" width="19" height="3" rx="1.5" fill="white"/>
    </g>

    <!-- =========================
         MAKE ICON
    ========================== -->

    <g id="makeIcon">
      <path d="M2 32 L9 5 L16 5 L13 32 Z"
            fill="#7B2CFF"/>
      <path d="M13 32 L19 5 L26 5 L23 32 Z"
            fill="#A52DFF"/>
      <path d="M24 32 L30 5 L37 5 L34 32 Z"
            fill="#B72EFF"/>
      <path d="M7 8 L12 8 L10 17 L5 17 Z"
            fill="#6B22FF"/>
    </g>

    <!-- =========================
         PDF ICON
    ========================== -->

    <g id="pdfIcon">
      <path d="M4 1 H27 L36 10 V41 H4 Z"
            fill="#F0443E"/>
      <path d="M27 1 V10 H36"
            fill="#FF8A80"/>
      <path d="M10 25
               C16 20 19 15 19 10
               C19 17 21 24 29 28
               C22 26 16 28 10 34
               C13 28 13 25 10 25 Z"
            fill="white"/>
    </g>

    <!-- =========================
         GMAIL ICON
    ========================== -->

    <g id="gmailIcon">
      <path d="M2 8 L18 20 L34 8 V35 H28 V16 L18 24 L8 16 V35 H2 Z"
            fill="#EA4335"/>
      <path d="M2 8 L8 13 V35 H2 Z"
            fill="#4285F4"/>
      <path d="M34 8 L28 13 V35 H34 Z"
            fill="#34A853"/>
      <path d="M2 8 L8 13 L18 20 L28 13 L34 8"
            fill="none"
            stroke="#FBBC04"
            stroke-width="4"/>
    </g>

    <!-- =========================
         DOCUMENT HEADER ICON
    ========================== -->

    <g id="documentIcon">
      <circle cx="30" cy="30" r="29"
              fill="#061c2d"
              stroke="#00eaff"
              stroke-width="2"/>
      <use xlink:href="#googleForms"
           x="13"
           y="8"
           width="34"
           height="42"/>
    </g>

  </defs>


  <!-- =========================
       BACKGROUND
  ========================== -->

  <rect width="900" height="720" fill="url(#bg)"/>

  <ellipse cx="110" cy="90" rx="230" ry="170"
           fill="url(#cyanGlow)"
           opacity=".55"/>

  <ellipse cx="780" cy="600" rx="250" ry="180"
           fill="url(#cyanGlow)"
           opacity=".2"/>

  <!-- subtle decorative lines -->
  <path d="M0 620 C180 570 240 690 430 620 S720 560 900 620"
        fill="none"
        stroke="#07354c"
        stroke-width="1"/>

  <path d="M0 650 C200 610 300 700 470 650 S730 600 900 650"
        fill="none"
        stroke="#06263a"
        stroke-width="1"/>



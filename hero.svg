<svg width="900" height="420" viewBox="0 0 900 420"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- ====================================================== -->
    <!-- BACKGROUND -->
    <!-- ====================================================== -->

    <linearGradient id="bg"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

      <stop offset="0%" stop-color="#07111c"/>
      <stop offset="55%" stop-color="#081a2b"/>
      <stop offset="100%" stop-color="#02070d"/>

    </linearGradient>


    <!-- ====================================================== -->
    <!-- GENERAL GLOW -->
    <!-- ====================================================== -->

    <filter id="glow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">

      <feGaussianBlur
        stdDeviation="5"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>


    <!-- ====================================================== -->
    <!-- SOFT GLOW -->
    <!-- ====================================================== -->

    <filter id="softGlow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">

      <feGaussianBlur stdDeviation="3"/>

    </filter>


    <!-- ====================================================== -->
    <!-- NAME NEON SWEEP -->
    <!-- Softer + slower -->
    <!-- ====================================================== -->

    <linearGradient id="nameGlow"
                    x1="-100%"
                    y1="0%"
                    x2="0%"
                    y2="0%">

      <stop offset="0%" stop-color="#168cff"/>
      <stop offset="42%" stop-color="#168cff"/>
      <stop offset="49%" stop-color="#b9dcff"/>
      <stop offset="53%" stop-color="#d946ef"/>
      <stop offset="58%" stop-color="#a855f7"/>
      <stop offset="65%" stop-color="#168cff"/>
      <stop offset="100%" stop-color="#168cff"/>

      <animate
        attributeName="x1"
        values="-100%;100%;-100%"
        dur="5.5s"
        repeatCount="indefinite"/>

      <animate
        attributeName="x2"
        values="0%;200%;0%"
        dur="5.5s"
        repeatCount="indefinite"/>

    </linearGradient>


    <!-- ====================================================== -->
    <!-- NAME NEON BLUR -->
    <!-- Reduced glow -->
    <!-- ====================================================== -->

    <filter id="nameNeon"
            x="-20%"
            y="-80%"
            width="140%"
            height="260%">

      <feGaussianBlur
        stdDeviation="1.6"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

  </defs>


  <!-- ====================================================== -->
  <!-- BACKGROUND -->
  <!-- ====================================================== -->

  <rect
    width="900"
    height="420"
    rx="24"
    fill="url(#bg)"/>


  <!-- ====================================================== -->
  <!-- ATMOSPHERIC GLOW -->
  <!-- ====================================================== -->

  <circle
    cx="720"
    cy="205"
    r="170"
    fill="#008cff"
    opacity="0.05"
    filter="url(#softGlow)"/>

  <circle
    cx="720"
    cy="205"
    r="115"
    fill="#00eaff"
    opacity="0.04"
    filter="url(#softGlow)"/>


  <!-- ====================================================== -->
  <!-- LEFT CONTENT -->
  <!-- ====================================================== -->

  <g font-family="Arial, Helvetica, sans-serif">


    <!-- ================================================== -->
    <!-- AI BADGE -->
    <!-- ================================================== -->

    <circle
      cx="52"
      cy="58"
      r="18"
      fill="#071827"
      stroke="#00d9ff"
      stroke-width="2">

      <animate
        attributeName="r"
        values="18;20;18"
        dur="2.5s"
        repeatCount="indefinite"/>

    </circle>


    <text
      x="52"
      y="64"
      text-anchor="middle"
      fill="#00d9ff"
      font-size="13"
      font-weight="bold">

      AI

    </text>


    <!-- ================================================== -->
    <!-- NAME -->
    <!-- ================================================== -->

    <text
      x="82"
      y="68"
      fill="#ffffff"
      font-size="34"
      font-weight="700">

      Hi, I'm

    </text>


    <!-- ================================================== -->
    <!-- NAME WITH SUBTLE MOVING HIGHLIGHT -->
    <!-- ================================================== -->

    <text
      x="82"
      y="68"
      dx="116"
      fill="url(#nameGlow)"
      filter="url(#nameNeon)"
      font-family="Arial, Helvetica, sans-serif"
      font-size="34"
      font-weight="700">

      Kamila Parveen

    </text>


    <!-- ================================================== -->
    <!-- ROLE -->
    <!-- ================================================== -->

    <text
      x="82"
      y="103"
      fill="#ffffff"
      font-size="18"
      font-weight="600">

      AI Automation Specialist

    </text>


    <!-- ================================================== -->
    <!-- DESCRIPTION -->
    <!-- ================================================== -->

    <text
      x="82"
      y="139"
      fill="#d8e7f3"
      font-size="13">

      I build practical AI-powered business automation systems

    </text>

    <text
      x="82"
      y="158"
      fill="#d8e7f3"
      font-size="13">

      that turn repetitive manual processes into structured,

    </text>

    <text
      x="82"
      y="177"
      fill="#d8e7f3"
      font-size="13">

      automated workflows.

    </text>


    <!-- ====================================================== -->
    <!-- TAG STYLES -->
    <!-- ====================================================== -->

    <style>

      .tag-box {
        fill: #071827;
        stroke: #00c8ff;
        stroke-width: 1.5;
      }

      .tag-text {
        text-anchor: middle;
        fill: #00c8ff;
        font-size: 11px;
        font-weight: 600;
        font-family: Arial, Helvetica, sans-serif;
      }

      /*
        All tags begin above their final position
        and slide downward into place.
      */

      .tag-group {
        opacity: 0;
        animation-name: tagDrop;
        animation-duration: 0.7s;
        animation-timing-function: cubic-bezier(.2,.8,.2,1);
        animation-fill-mode: forwards;
      }

      .tag-row-1 {
        animation-delay: 1.8s;
      }

      .tag-row-2 {
        animation-delay: 2.4s;
      }

      .tag-row-3 {
        animation-delay: 3.0s;
      }

      @keyframes tagDrop {

        0% {
          opacity: 0;
          transform: translateY(-35px);
        }

        70% {
          opacity: 1;
          transform: translateY(5px);
        }

        100% {
          opacity: 1;
          transform: translateY(0);
        }

      }

      /*
        Purple neon hover effect
      */

      .tag-box:hover {
        stroke: #b66cff;
        filter: drop-shadow(0 0 6px #b66cff);
      }

      .tag-text:hover {
        fill: #b66cff;
      }

    </style>


    <!-- ====================================================== -->
    <!-- ROW 1 -->
    <!-- APIs + LLMs -->
    <!-- ====================================================== -->

    <g class="tag-group tag-row-1">

      <!-- APIs -->

      <rect
        class="tag-box"
        x="82"
        y="205"
        width="92"
        height="30"
        rx="15"/>

      <text
        class="tag-text"
        x="128"
        y="224">

        APIs

      </text>


      <!-- LLMs -->

      <rect
        class="tag-box"
        x="184"
        y="205"
        width="92"
        height="30"
        rx="15"/>

      <text
        class="tag-text"
        x="230"
        y="224">

        LLMs

      </text>

    </g>


    <!-- ====================================================== -->
    <!-- ROW 2 -->
    <!-- Automation + AI Agents -->
    <!-- ====================================================== -->

    <g class="tag-group tag-row-2">

      <!-- Automation -->

      <rect
        class="tag-box"
        x="82"
        y="243"
        width="92"
        height="30"
        rx="15"/>

      <text
        class="tag-text"
        x="128"
        y="262">

        Automation

      </text>


      <!-- AI Agents -->

      <rect
        class="tag-box"
        x="184"
        y="243"
        width="92"
        height="30"
        rx="15"/>

      <text
        class="tag-text"
        x="230"
        y="262">

        AI Agents

      </text>

    </g>


    <!-- ====================================================== -->
    <!-- ROW 3 -->
    <!-- Business Tools -->
    <!-- Centered between the two columns -->
    <!-- ====================================================== -->

    <g class="tag-group tag-row-3">

      <rect
        class="tag-box"
        x="128"
        y="281"
        width="110"
        height="30"
        rx="15"/>

      <text
        class="tag-text"
        x="183"
        y="300">

        Business Tools

      </text>

    </g>


  </g>


  <!-- ====================================================== -->
  <!-- LAPTOP -->
  <!-- ====================================================== -->

  <g transform="translate(625 230)">


    <!-- ================================================== -->
    <!-- LAPTOP BASE -->
    <!-- ================================================== -->

    <path
      d="M-115 92 L115 92 L145 116 L-145 116 Z"
      fill="#07111c"
      stroke="#00d9ff"
      stroke-width="3"/>

    <path
      d="M-145 116 L145 116"
      stroke="#00d9ff"
      stroke-width="4"
      filter="url(#glow)"/>


    <!-- ================================================== -->
    <!-- OPENING SCREEN -->
    <!-- ================================================== -->

    <g
      transform="rotate(75 0 0)"
      opacity="0">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="75 0 0"
        to="0 0 0"
        dur="0.9s"
        begin="0.25s"
        fill="freeze"/>

      <animate
        attributeName="opacity"
        from="0"
        to="1"
        dur="0.25s"
        begin="0.25s"
        fill="freeze"/>


      <!-- SCREEN FRAME -->

      <rect
        x="-105"
        y="-88"
        width="210"
        height="145"
        rx="9"
        fill="#050b12"
        stroke="#00d9ff"
        stroke-width="3"/>


      <!-- SCREEN -->

      <rect
        x="-95"
        y="-78"
        width="190"
        height="125"
        rx="5"
        fill="#061522"
        stroke="#008cff"
        stroke-width="1"/>


      <!-- CODE -->

      <text
        x="0"
        y="5"
        text-anchor="middle"
        fill="#00eaff"
        font-family="monospace"
        font-size="38"
        font-weight="bold"
        filter="url(#glow)">

        &lt;/&gt;

      </text>

    </g>

  </g>


  <!-- ====================================================== -->
  <!-- GOOGLE ICON -->
  <!-- ====================================================== -->

  <g opacity="0">

    <animateTransform
      attributeName="transform"
      type="translate"
      from="625 230"
      to="535 120"
      dur="0.7s"
      begin="1.15s"
      fill="freeze"/>

    <animateTransform
      attributeName="transform"
      type="scale"
      from=".15"
      to="1"
      additive="sum"
      dur="0.7s"
      begin="1.15s"
      fill="freeze"/>

    <animate
      attributeName="opacity"
      from="0"
      to="1"
      dur="0.35s"
      begin="1.15s"
      fill="freeze"/>

    <rect
      x="-24"
      y="-24"
      width="48"
      height="48"
      rx="10"
      fill="#ffffff"/>

    <text
      x="0"
      y="7"
      text-anchor="middle"
      fill="#4285F4"
      font-family="Arial"
      font-size="25"
      font-weight="bold">

      G

    </text>

  </g>


  <!-- ====================================================== -->
  <!-- AI ICON -->
  <!-- ====================================================== -->

  <g opacity="0">

    <animateTransform
      attributeName="transform"
      type="translate"
      from="625 230"
      to="690 105"
      dur="0.75s"
      begin="1.3s"
      fill="freeze"/>

    <animate
      attributeName="opacity"
      from="0"
      to="1"
      dur="0.35s"
      begin="1.3s"
      fill="freeze"/>

    <rect
      x="-24"
      y="-24"
      width="48"
      height="48"
      rx="10"
      fill="#ffffff"/>

    <circle
      cx="0"
      cy="0"
      r="13"
      fill="#10a37f"/>

    <text
      x="0"
      y="5"
      text-anchor="middle"
      fill="#ffffff"
      font-family="Arial"
      font-size="13"
      font-weight="bold">

      AI

    </text>

  </g>


  <!-- ====================================================== -->
  <!-- NOTION ICON -->
  <!-- ====================================================== -->

  <g opacity="0">

    <animateTransform
      attributeName="transform"
      type="translate"
      from="625 230"
      to="755 155"
      dur="0.8s"
      begin="1.45s"
      fill="freeze"/>

    <animate
      attributeName="opacity"
      from="0"
      to="1"
      dur="0.35s"
      begin="1.45s"
      fill="freeze"/>

    <rect
      x="-24"
      y="-24"
      width="48"
      height="48"
      rx="10"
      fill="#ffffff"/>

    <text
      x="0"
      y="8"
      text-anchor="middle"
      fill="#111111"
      font-family="Arial"
      font-size="25"
      font-weight="bold">

      N

    </text>

  </g>


  <!-- ====================================================== -->
  <!-- API ICON -->
  <!-- ====================================================== -->

  <g opacity="0">

    <animateTransform
      attributeName="transform"
      type="translate"
      from="625 230"
      to="700 300"
      dur="0.8s"
      begin="1.6s"
      fill="freeze"/>

    <animate
      attributeName="opacity"
      from="0"
      to="1"
      dur="0.35s"
      begin="1.6s"
      fill="freeze"/>

    <rect
      x="-24"
      y="-24"
      width="48"
      height="48"
      rx="10"
      fill="#ffffff"/>

    <text
      x="0"
      y="6"
      text-anchor="middle"
      fill="#5865f2"
      font-family="Arial"
      font-size="13"
      font-weight="bold">

      API

    </text>

  </g>


  <!-- ====================================================== -->
  <!-- CONNECTION LINES -->
  <!-- ====================================================== -->

  <g
    stroke="#00cfff"
    stroke-width="1"
    opacity="0.35">

    <line
      x1="559"
      y1="120"
      x2="625"
      y2="205">

      <animate
        attributeName="opacity"
        values="0;.35;.35"
        dur="1.2s"
        begin="1.2s"
        fill="freeze"/>

    </line>


    <line
      x1="690"
      y1="129"
      x2="625"
      y2="205">

      <animate
        attributeName="opacity"
        values="0;.35;.35"
        dur="1.2s"
        begin="1.35s"
        fill="freeze"/>

    </line>


    <line
      x1="731"
      y1="155"
      x2="675"
      y2="205">

      <animate
        attributeName="opacity"
        values="0;.35;.35"
        dur="1.2s"
        begin="1.45s"
        fill="freeze"/>

    </line>

  </g>


  <!-- ====================================================== -->
  <!-- AUTOMATION TAG GLOW -->
  <!-- ====================================================== -->

  <g opacity="0.25">

    <rect
      x="82"
      y="243"
      width="92"
      height="30"
      rx="15"
      fill="none"
      stroke="#00eaff"
      stroke-width="3"
      filter="url(#softGlow)">

      <animate
        attributeName="opacity"
        values=".15;.5;.15"
        dur="2.5s"
        repeatCount="indefinite"/>

    </rect>

  </g>


  <!-- ====================================================== -->
  <!-- BOTTOM ACCENT -->
  <!-- ====================================================== -->

  <line
    x1="82"
    y1="330"
    x2="820"
    y2="330"
    stroke="#00d9ff"
    stroke-width="1"
    opacity="0.12"/>


</svg>

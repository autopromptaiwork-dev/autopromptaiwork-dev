<svg width="900" height="320" viewBox="0 0 900 320"
     xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="blueCyan" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2563EB"/>
    <stop offset="55%" stop-color="#00D9FF"/>
    <stop offset="100%" stop-color="#00F2FF"/>
  </linearGradient>

  <radialGradient id="glowBlue">
    <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#172554"/>
    <stop offset="100%" stop-color="#020617"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>


<!-- BACKGROUND -->

<rect
  width="900"
  height="320"
  rx="18"
  fill="#071019"
/>

<!-- subtle blue atmosphere -->

<ellipse
  cx="700"
  cy="165"
  rx="270"
  ry="180"
  fill="url(#glowBlue)"
  opacity="0.45"
/>


<!-- LEFT CONTENT -->

<!-- small AI mark -->


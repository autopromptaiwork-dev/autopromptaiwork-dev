<svg width="700" height="580" viewBox="0 0 700 580"
     xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- PURPLE CARD -->
  <linearGradient id="cardPurpleFill" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#170f2e" stop-opacity="0.98"/>
    <stop offset="100%" stop-color="#0f0a1f" stop-opacity="0.98"/>
  </linearGradient>

  <!-- CTA -->
  <linearGradient id="ctaPurpleFill" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#241640"/>
    <stop offset="100%" stop-color="#301a4d"/>
  </linearGradient>

  <!-- HOVER GLOW -->
  <filter id="glowPurpleStrong"
          x="-100%" y="-100%"
          width="300%" height="300%">
    <feGaussianBlur stdDeviation="10" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- HOVER SWEEP -->
  <linearGradient id="sweepGradPurple"
                  x1="0%" y1="0%"
                  x2="0%" y2="100%">
    <stop offset="0%" stop-color="#d8b4fe" stop-opacity="0"/>
    <stop offset="50%" stop-color="#d8b4fe" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#d8b4fe" stop-opacity="0"/>
  </linearGradient>

  <mask id="sweepMaskPurple"
        maskUnits="userSpaceOnUse"
        x="-20" y="-20"
        width="740" height="620">
    <rect x="-20" y="-20"
          width="740" height="620"
          fill="black"/>

    <rect x="0" y="0"
          width="700" height="580"
          rx="22"
          fill="none"
          stroke="white"
          stroke-width="5"/>
  </mask>

  <style>

    text {
      font-family: Arial, Helvetica, sans-serif;
    }

    /* CARD HOVER */
    .project-card {
      cursor: pointer;
    }

    .cardBorderPurple {
      transition:
        filter 0.25s ease,
        stroke-width 0.25s ease;
    }

    .project-card:hover .cardBorderPurple {
      stroke-width: 2.8;
      filter: url(#glowPurpleStrong);
    }

    /* LIGHT SWEEP */
    .sweepBarPurple {
      animation-play-state: paused;
    }

    .project-card:hover .sweepBarPurple {
      animation:
        sweepDown 1.7s linear infinite;
      animation-play-state: running;
    }

    @keyframes sweepDown {
      0% {
        transform: translateY(0px);
      }

      100% {
        transform: translateY(580px);
      }
    }

    /* WORKFLOW NODES */
    .workflow-node {
      transition:
        transform 0.22s ease;
      transform-box: fill-box;
      transform-origin: center;
      cursor: pointer;
    }

    .workflow-node .nodeBorder {
      transition:
        filter 0.22s ease,
        stroke-width 0.22s ease;
    }

    .workflow-node:hover {
      transform:
        translateY(-4px)
        scale(1.04);
    }

    .workflow-node:hover .nodeBorder {
      stroke-width: 2.5;
      filter: url(#glowPurpleStrong);
    }

    /* TECHNOLOGY PILLS */
    .tech-pill {
      transition:
        transform 0.2s ease;
      transform-box: fill-box;
      transform-origin: center;
      cursor: pointer;
    }

    .tech-pill .pillBorder {
      transition:
        filter 0.2s ease,
        stroke-width 0.2s ease;
    }

    .tech-pill:hover {
      transform:
        translateY(-3px)
        scale(1.03);
    }

    .tech-pill:hover .pillBorder {
      stroke-width: 2.2;
      filter: url(#glowPurpleStrong);
    }

    /* CTA */
    .cta-button {
      transition:
        transform 0.25s ease;
      transform-box: fill-box;
      transform-origin: center;
      cursor: pointer;
    }

    .cta-button .ctaBorder {
      transition:
        filter 0.25s ease,
        stroke-width 0.25s ease;
    }

    .cta-button:hover {
      transform:
        translateY(-3px)
        scale(1.02);
    }

    .cta-button:hover .ctaBorder {
      stroke-width: 2.6;
      filter: url(#glowPurpleStrong);
    }

  </style>

</defs>


